```toml
[project]
name = "price-prediction"
version = "0.1.0"
description = "Price Prediction System using Machine Learning and Streamlit"
requires-python = ">=3.11,<3.14"
dependencies = [
    "category-encoders>=2.10.0",
    "joblib>=1.6.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "streamlit>=1.40.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
```
